  <line x1="80" y1="68" x2="600" y2="68" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="128" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:42px;font-weight:700;text-anchor:middle;dominant-baseline:auto">تَشَوُّق</text>
  <text x="340" y="162" text-anchor="middle" style="fill:rgb(255, 93, 109);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:18px;font-weight:400;text-anchor:middle;dominant-baseline:auto">إيثوس الصحراء في ساعة الثالثة والربع فجراً</text>

  <line x1="80" y1="182" x2="600" y2="182" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="228" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">الصحراءُ لا تُزار، بل تَدَّعي.</text>
  <text x="340" y="264" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">ومن لمسَتهُ مرةً واحدةً</text>
  <text x="340" y="300" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">باتت سائرُ المناظر طوالَ عمره مجردَ انتظار.</text>

  <line x1="120" y1="322" x2="560" y2="322" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="362" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">الصمتُ هناك ليس غيابَ الصوت،</text>
  <text x="340" y="394" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">بل هو ضغطٌ حيٌّ — يسمعُك وأنتَ تسمعُه،</text>
  <text x="340" y="426" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">والسماءُ في الثالثة والربع فجراً ليست مجردَ جمال،</text>
  <text x="340" y="458" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">بل هي حجةٌ لا تُردّ على وجود شيءٍ أكبرَ منّا.</text>

  <line x1="120" y1="480" x2="560" y2="480" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="520" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">التشوّقُ ليس نوستالجيا — فالنوستالجيا تنظرُ للوراء.</text>
  <text x="340" y="552" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">التشوّقُ يشدُّك في كل الاتجاهات في آنٍ واحد:</text>
  <text x="340" y="584" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">نحوَ ما مضى، ونحوَ ما لم يأتِ بعد،</text>
  <text x="340" y="616" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">ونحوَ لحظةٍ حاضرةٍ تبدو دومًا ناقصةً بلا رمالها.</text>

  <line x1="120" y1="638" x2="560" y2="638" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="682" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">من لمستهُ الصحراء يحملُ جزءًا منها،</text>
  <text x="340" y="716" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">لا في الذاكرة وحدها،</text>
  <text x="340" y="750" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">بل في طريقةِ إنصاتِه للصمت.</text>

  <line x1="80" y1="774" x2="600" y2="774" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

