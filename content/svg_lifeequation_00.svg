<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">

  <style>
    text { font-family: Georgia, serif; }
    .label { font-family: Arial, sans-serif; font-size: 11px; fill: #888; }
    .varbox { fill: #f7f6ff; stroke: #b0a8e0; stroke-width: 0.8; }
    .varbox-teal { fill: #edfaf4; stroke: #5dcaa5; stroke-width: 0.8; }
  </style>

  <!-- Outer card -->
  <rect x="10" y="10" width="660" height="195" rx="12" fill="#fafafa" stroke="#d0cee8" stroke-width="0.8"/>

  <!-- Main equation -->
  <!-- L -->
  <text x="90" y="100" font-size="54" font-weight="bold" fill="#222" text-anchor="middle">L</text>
  <!-- = -->
  <text x="140" y="98" font-size="40" fill="#555" text-anchor="middle">=</text>
  <!-- integral symbol -->
  <text x="195" y="108" font-size="72" font-weight="300" fill="#534AB7" text-anchor="middle">∫</text>
  <!-- bounds -->
  <text x="213" y="60" font-size="13" fill="#7F77DD" text-anchor="start">∞</text>
  <text x="207" y="140" font-size="12" fill="#7F77DD" text-anchor="start">birth</text>
  <!-- M(P, U) -->
  <text x="240" y="90" font-size="38" font-weight="bold" fill="#222" text-anchor="start">M</text>
  <text x="276" y="90" font-size="28" fill="#444" text-anchor="start">(P, U)</text>
  <!-- dt -->
  <text x="378" y="90" font-size="28" fill="#1D9E75" text-anchor="start">dt</text>

  <!-- Divider -->
  <line x1="30" y1="155" x2="650" y2="155" stroke="#e0ddf5" stroke-width="0.8"/>

  <!-- Variable boxes -->
  <!-- L -->
  <rect x="30" y="163" width="90" height="32" rx="6" class="varbox"/>
  <text x="75" y="172" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle" font-family="Georgia,serif">L</text>
  <text x="75" y="186" font-size="10" fill="#7F77DD" text-anchor="middle" font-family="Arial,sans-serif">Life</text>

  <!-- M -->
  <rect x="135" y="163" width="130" height="32" rx="6" class="varbox"/>
  <text x="200" y="172" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle" font-family="Georgia,serif">M</text>
  <text x="200" y="186" font-size="10" fill="#7F77DD" text-anchor="middle" font-family="Arial,sans-serif">Meaning (your call)</text>

  <!-- P -->
  <rect x="280" y="163" width="130" height="32" rx="6" class="varbox"/>
  <text x="345" y="172" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle" font-family="Georgia,serif">P</text>
  <text x="345" y="186" font-size="10" fill="#7F77DD" text-anchor="middle" font-family="Arial,sans-serif">Probability (given)</text>

  <!-- U -->
  <rect x="425" y="163" width="130" height="32" rx="6" class="varbox-teal"/>
  <text x="490" y="172" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle" font-family="Georgia,serif">U</text>
  <text x="490" y="186" font-size="10" fill="#0F6E56" text-anchor="middle" font-family="Arial,sans-serif">Uncertainty (given)</text>

  <!-- dt -->
  <rect x="570" y="163" width="80" height="32" rx="6" class="varbox-teal"/>
  <text x="610" y="172" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle" font-family="Georgia,serif">dt</text>
  <text x="610" y="186" font-size="10" fill="#0F6E56" text-anchor="middle" font-family="Arial,sans-serif">time</text>

</svg>
