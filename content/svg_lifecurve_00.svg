<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">

  <style>
    text { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
    .label-purple { fill: #534AB7; }
    .label-teal { fill: #0F6E56; }
    .label-muted { fill: #aaa; font-size: 11px; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="curvefill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F77DD" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lifeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="4" y="4" width="672" height="472" rx="12" fill="#fafafa" stroke="#e0ddf5" stroke-width="0.8"/>

  <!-- Axes -->
  <line x1="60" y1="400" x2="640" y2="400" stroke="#bbb" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="60" y1="400" x2="60" y2="30" stroke="#bbb" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="645" y="405" font-size="14" font-style="italic" fill="#888">t</text>
  <text x="48" y="26" font-size="14" font-style="italic" fill="#888" text-anchor="middle">L</text>
  <text x="60" y="418" font-size="10" fill="#bbb" text-anchor="middle">birth</text>
  <text x="628" y="418" font-size="13" fill="#bbb" text-anchor="middle">∞</text>

  <!-- Uncertainty band upper (dashed purple) -->
  <path d="M60,330 C120,295 160,258 200,238 C240,218 270,193 320,168 C370,146 400,118 450,103 C490,90 530,78 622,66"
        fill="none" stroke="#AFA9EC" stroke-width="0.8" stroke-dasharray="4 4"/>

  <!-- Uncertainty band lower (dashed teal) -->
  <path d="M60,378 C120,362 160,346 200,326 C240,306 270,290 320,274 C370,258 400,234 450,221 C490,211 530,202 622,193"
        fill="none" stroke="#5DCAA5" stroke-width="0.8" stroke-dasharray="4 4"/>

  <!-- Filled area under curve -->
  <path d="M60,400 C120,395 160,380 200,360 C240,340 270,315 320,294 C370,274 400,240 450,220 C490,206 530,188 622,170 L622,400 Z"
        fill="url(#curvefill)"/>

  <!-- Main life curve -->
  <path d="M60,400 C120,395 160,380 200,360 C240,340 270,315 320,294 C370,274 400,240 450,220 C490,206 530,188 622,170"
        fill="none" stroke="url(#lifeline)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Probability scatter dots -->
  <circle cx="130" cy="388" r="2" fill="#7F77DD" opacity="0.30"/>
  <circle cx="155" cy="375" r="1.5" fill="#7F77DD" opacity="0.20"/>
  <circle cx="175" cy="368" r="2.5" fill="#7F77DD" opacity="0.25"/>
  <circle cx="215" cy="352" r="2" fill="#7F77DD" opacity="0.30"/>
  <circle cx="245" cy="333" r="1.5" fill="#534AB7" opacity="0.20"/>
  <circle cx="275" cy="318" r="2" fill="#534AB7" opacity="0.25"/>
  <circle cx="300" cy="305" r="3" fill="#534AB7" opacity="0.15"/>
  <circle cx="335" cy="286" r="2" fill="#1D9E75" opacity="0.30"/>
  <circle cx="360" cy="278" r="1.5" fill="#1D9E75" opacity="0.20"/>
  <circle cx="390" cy="252" r="2.5" fill="#1D9E75" opacity="0.25"/>
  <circle cx="420" cy="232" r="2" fill="#1D9E75" opacity="0.30"/>
  <circle cx="460" cy="216" r="2" fill="#1D9E75" opacity="0.20"/>
  <circle cx="490" cy="200" r="1.5" fill="#0F6E56" opacity="0.25"/>
  <circle cx="520" cy="190" r="2" fill="#0F6E56" opacity="0.30"/>
  <circle cx="560" cy="180" r="2.5" fill="#0F6E56" opacity="0.20"/>
  <circle cx="595" cy="174" r="1.5" fill="#0F6E56" opacity="0.25"/>

  <!-- Annotation: M rises -->
  <line x1="320" y1="294" x2="320" y2="258" stroke="#b0a8e0" stroke-width="0.8" stroke-dasharray="2 2"/>
  <circle cx="320" cy="294" r="4" fill="#534AB7" opacity="0.8"/>
  <text x="328" y="254" class="label-purple" font-size="11">M rises</text>

  <!-- Annotation: M(P,U) -->
  <line x1="200" y1="360" x2="168" y2="334" stroke="#b0a8e0" stroke-width="0.8" stroke-dasharray="2 2"/>
  <circle cx="200" cy="360" r="4" fill="#7F77DD" opacity="0.7"/>
  <text x="112" y="330" class="label-purple" font-size="11">M(P, U)</text>

  <!-- Open horizon dot -->
  <circle cx="622" cy="170" r="5" fill="none" stroke="#1D9E75" stroke-width="1.5" opacity="0.9"/>
  <text x="630" y="162" class="label-teal" font-size="13">∞</text>

  <!-- Integral area label -->
  <text x="380" y="372" text-anchor="middle" font-size="11" fill="#aaa">area = ∫ M(P,U) dt = L</text>

  <!-- Legend -->
  <line x1="68" y1="56" x2="98" y2="56" stroke="#AFA9EC" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="104" y="60" class="label-muted">upper uncertainty band</text>
  <line x1="68" y1="74" x2="98" y2="74" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="104" y="78" class="label-muted">lower uncertainty band</text>
  <line x1="68" y1="92" x2="98" y2="92" stroke="url(#lifeline)" stroke-width="2.5"/>
  <text x="104" y="96" class="label-muted">L — the lived path</text>

</svg>
