<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <style>
    .bg { fill: #000000; }
    .helm-line { stroke: #ff0000; stroke-width: 5; fill: none; stroke-linecap: round; }
    .center-hub { fill: #000000; stroke: #ff0000; stroke-width: 5; }
  </style>

  <rect width="800" height="800" class="bg" />

  <g transform="translate(400, 400)">
    
    <circle r="120" class="helm-line" />
    <circle r="220" class="helm-line" />
    <circle r="300" class="helm-line" />
    
    <circle r="30" class="helm-line" />

    <line x1="-30" y1="0" x2="-350" y2="0" class="helm-line" />
    <line x1="-350" y1="-15" x2="-350" y2="15" class="helm-line" />
    <line x1="30" y1="0" x2="350" y2="0" class="helm-line" />
    <line x1="350" y1="-15" x2="350" y2="15" class="helm-line" />

    <g transform="rotate(45)">
      <line x1="0" y1="-30" x2="0" y2="-350" class="helm-line" />
      <line x1="-15" y1="-350" x2="15" y2="-350" class="helm-line" />
      
      <line x1="0" y1="30" x2="0" y2="350" class="helm-line" />
      <line x1="-15" y1="350" x2="15" y2="350" class="helm-line" />
    </g>

    <g transform="rotate(135)">
      <line x1="0" y1="-30" x2="0" y2="-350" class="helm-line" />
      <line x1="-15" y1="-350" x2="15" y2="-350" class="helm-line" />
      
      <line x1="0" y1="30" x2="0" y2="350" class="helm-line" />
      <line x1="-15" y1="350" x2="15" y2="350" class="helm-line" />
    </g>

    <circle cx="0" cy="0" r="10" class="center-hub" />
  </g>
</svg>
