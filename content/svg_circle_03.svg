    <stop offset="40%" stop-color="#5e8fff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#3ad9ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="jetBottom" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#9b59ff" stop-opacity="0.9"/>
    <stop offset="40%" stop-color="#5e8fff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#3ad9ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="lensHalo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7b2fff" stop-opacity="0"/>
    <stop offset="55%" stop-color="#7b2fff" stop-opacity="0"/>
    <stop offset="72%" stop-color="#5500cc" stop-opacity="0.18"/>
    <stop offset="82%" stop-color="#2200aa" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000033" stop-opacity="0"/>
