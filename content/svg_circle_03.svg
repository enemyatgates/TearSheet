  <circle cx="950" cy="80" r="1.4" opacity="0.9"/>
  <circle cx="1020" cy="200" r="0.7" opacity="0.5"/>
  <circle cx="60" cy="400" r="1.0" opacity="0.7"/>
  <circle cx="140" cy="700" r="0.9" opacity="0.6"/>
  <circle cx="30" cy="900" r="1.3" opacity="0.8"/>
  <circle cx="1040" cy="600" r="1.1" opacity="0.7"/>
  <circle cx="980" cy="900" r="0.8" opacity="0.5"/>
  <circle cx="820" cy="50" r="1.0" opacity="0.6"/>
  <circle cx="300" cy="30" r="0.7" opacity="0.5"/>
  <circle cx="700" cy="25" r="1.2" opacity="0.7"/>
  <circle cx="150" cy="250" r="0.6" opacity="0.4"/>
  <circle cx="920" cy="320" r="0.9" opacity="0.6"/>
  <circle cx="50" cy="550" r="1.1" opacity="0.7"/>
  <circle cx="1050" cy="750" r="0.8" opacity="0.5"/>
  <circle cx="400" cy="1050" r="1.0" opacity="0.6"/>
