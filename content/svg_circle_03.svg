<polygon points="540,200 510,10 570,10" fill="url(#jetTop)" opacity="0.7"/>
<polygon points="540,200 495,0 585,0" fill="url(#jetTop)" opacity="0.35"/>
<polygon points="540,880 510,1070 570,1070" fill="url(#jetBottom)" opacity="0.7"/>
<polygon points="540,880 495,1080 585,1080" fill="url(#jetBottom)" opacity="0.35"/>

<circle cx="540" cy="540" r="480" fill="url(#lensHalo)"/>
<circle cx="540" cy="540" r="430" fill="url(#discGlow)"/>
<circle cx="540" cy="540" r="370" fill="url(#photonRing)"/>
<circle cx="540" cy="540" r="340" fill="url(#eventHorizon)"/>
<circle cx="540" cy="540" r="342" fill="none" stroke="#7b2fff" stroke-width="3" opacity="0.35"/>
<circle cx="540" cy="540" r="348" fill="none" stroke="#5e00cc" stroke-width="1.5" opacity="0.2"/>

<line x1="540" y1="200" x2="0" y2="200" stroke="#ffd700" stroke-width="2" opacity="0.85"/>
<line x1="540" y1="880" x2="1080" y2="880" stroke="#ffd700" stroke-width="2" opacity="0.85"/>

<text
