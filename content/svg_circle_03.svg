<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"
  style="display:block; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
<defs>
  <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0a0a1a"/>
    <stop offset="100%" stop-color="#000005"/>
  </radialGradient>
  <radialGradient id="eventHorizon" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="75%" stop-color="#05000f"/>
    <stop offset="100%" stop-color="#150030"/>
  </radialGradient>
  <radialGradient id="discGlow" cx="50%" cy="58%" r="52%">
