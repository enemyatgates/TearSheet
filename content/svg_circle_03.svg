    <stop offset="62%" stop-color="#ff8c00" stop-opacity="0.55"/>
    <stop offset="72%" stop-color="#ffd700" stop-opacity="0.85"/>
    <stop offset="78%" stop-color="#ff4500" stop-opacity="0.6"/>
    <stop offset="88%" stop-color="#c0005a" stop-opacity="0.35"/>
