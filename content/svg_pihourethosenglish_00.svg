<svg width="100%" viewBox="0 0 690 910" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The Pi-Hour — Ethos of a Life Well Lived</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">English ethos of the Pi-Hour philosophy: begin at 03:14, end at 22:07, in between a life well lived</desc>
  <defs>
    
  </defs>

  <rect width="680" height="900" fill="#0a0a0a" data-darkreader-inline-fill="" style="--darkreader-inline-fill: var(--darkreader-background-0a0a0a, #1e2021);;fill:rgb(10, 10, 10);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- top stars -->
  <g opacity="0.7" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <circle cx="340" cy="36" r="2" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="316" cy="44" r="1.2" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="364" cy="44" r="1.2" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="292" cy="38" r="1" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="388" cy="38" r="1" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="260" cy="50" r="0.8" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="420" cy="50" r="0.8" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="236" cy="44" r="1.3" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="444" cy="44" r="1.3" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="200" cy="56" r="0.7" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="480" cy="56" r="0.7" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="170" cy="40" r="1" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="510" cy="40" r="1" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <line x1="80" y1="68" x2="600" y2="68" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- π symbol large -->
  <text x="340" y="136" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:52px;font-weight:700;text-anchor:middle;dominant-baseline:auto">π</text>
  <text x="340" y="170" text-anchor="middle" style="fill:rgb(255, 93, 109);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:17px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">The Pi-Hour — Ethos of a Life Well Lived</text>

  <line x1="80" y1="190" x2="600" y2="190" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- times -->
  <text x="240" y="238" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:auto">03 : 14</text>
  <text x="340" y="238" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">—</text>
  <text x="440" y="238" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:auto">22 : 07</text>
  <text x="340" y="264" text-anchor="middle" style="fill:rgb(255, 93, 109);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:17px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">the irrational hour opens · the chosen hour closes</text>

  <line x1="120" y1="284" x2="560" y2="284" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- opening verse -->
  <text x="340" y="326" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:21px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">Begin before the world wants anything from you.</text>
  <text x="340" y="360" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:21px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">End before the day simply runs out.</text>
  <text x="340" y="394" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:21px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">In between — not a schedule, but a life.</text>

  <line x1="120" y1="416" x2="560" y2="416" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body -->
  <text x="340" y="456" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">03:14 is the irrational hour — dark, silent, prior.</text>
  <text x="340" y="488" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Before ambition wakes, before roles are put on,</text>
  <text x="340" y="520" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">the self exists in its own company, undivided.</text>

  <line x1="120" y1="542" x2="560" y2="542" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="582" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">π does not resolve. It does not arrive.</text>
  <text x="340" y="614" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">It unfolds — more precise the longer you attend.</text>
  <text x="340" y="646" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">A life well lived has the same quality:</text>
  <text x="340" y="678" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">it deepens without conclusion.</text>

  <line x1="120" y1="700" x2="560" y2="700" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="740" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">22:07 — you did not run out. You stopped.</text>
  <text x="340" y="772" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">There is dignity in the closed parenthesis,</text>
  <text x="340" y="804" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">in choosing the hour the day is set down.</text>

  <line x1="120" y1="826" x2="560" y2="826" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- closing -->
  <text x="340" y="858" text-anchor="middle" style="fill:rgb(255, 93, 109);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:18px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">18 hours · 53 minutes · the irrational made whole</text>

  <line x1="80" y1="876" x2="600" y2="876" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- bottom stars -->
  <g opacity="0.7" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <circle cx="340" cy="890" r="2" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="316" cy="894" r="1.2" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="364" cy="894" r="1.2" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="292" cy="890" r="0.8" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="388" cy="890" r="0.8" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

