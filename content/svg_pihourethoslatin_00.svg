  <text x="340" y="238" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">—</text>
  <text x="440" y="238" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:auto">XXII : VII</text>
  <text x="340" y="264" text-anchor="middle" style="fill:rgb(255, 93, 109);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:17px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">hora irrationalis aperit · hora electa claudit</text>

  <line x1="120" y1="284" x2="560" y2="284" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- opening verse -->
  <text x="340" y="326" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:21px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">Incipe antequam mundus quidquam poscat.</text>
  <text x="340" y="360" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:21px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">Finem fac antequam dies ipse effluat.</text>
  <text x="340" y="394" text-anchor="middle" style="fill:rgb(255, 48, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:21px;font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:auto">Inter haec — non ordo, sed vita.</text>

  <line x1="120" y1="416" x2="560" y2="416" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body 1 -->
  <text x="340" y="456" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">III:XIV est hora irrationalis — obscura, silens, prior.</text>
  <text x="340" y="488" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Antequam ambitio evigilat, antequam personae induuntur,</text>
  <text x="340" y="520" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">animus in sua comitatu manet, indivisus.</text>

  <line x1="120" y1="542" x2="560" y2="542" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body 2 -->
  <text x="340" y="582" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">π non resolvitur. Non pervenit.</text>
  <text x="340" y="614" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Evolvitur — subtilior quo diutius attenditur.</text>
  <text x="340" y="646" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Vita bene acta eandem naturam habet:</text>
  <text x="340" y="678" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">profundescit sine fine.</text>

  <line x1="120" y1="700" x2="560" y2="700" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body 3 -->
  <text x="340" y="740" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">XXII:VII — non defecisti. Stetisti.</text>
  <text x="340" y="772" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Dignitas inest in parenthesi clausa,</text>
  <text x="340" y="804" text-anchor="middle" style="fill:rgb(232, 184, 190);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">in eligendo qua hora dies deponitur.</text>

  <line x1="120" y1="826" x2="560" y2="826" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- closing -->
  <text x="340" y="856" text-anchor="middle" style="fill:rgb(255, 93, 109);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;EB Garamond&quot;, serif;font-size:17px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">XVIII horae · LIII minuta · irrationale fit integrum</text>

  <line x1="80" y1="874" x2="600" y2="874" style="fill:rgb(0, 0, 0);stroke:rgb(255, 48, 78);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

