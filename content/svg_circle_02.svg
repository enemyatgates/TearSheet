<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"
  style="display:block; margin:auto; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; }
  </style>

  <!-- Circle centered in canvas, large enough to engulf text with wide margins -->
  <circle cx="540" cy="540" r="340" stroke="black" stroke-width="2.5" fill="none" />

  <!-- Text centered inside the circle -->
  <text
    x="540" y="540"
    font-size="72"
    font-family="Georgia, serif"
    text-anchor="middle"
    alignment-baseline="middle"
    dominant-baseline="central"
  >Me, Myself, and I</text>

  <!-- Bottom tangent: horizontal line tangent at bottom of circle (cy + r = 880)
       Starts at middle-bottom (540, 880), moves Left to Right -->
  <line x1="540" y1="880" x2="1080" y2="880" stroke="black" stroke-width="2.5" />

  <!-- Top tangent: horizontal line tangent at top of circle (cy - r = 200)
       Starts at middle-top (540, 200), moves Right to Left -->
  <line x1="540" y1="200" x2="0" y2="200" stroke="black" stroke-width="2.5" />

</svg>
