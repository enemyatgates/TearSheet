<svg width="100%" viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">تشوّق — إيثوس الصحراء</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">An Arabic ethos centered on tashaouq, yearning for the desert, written in classical Arabic calligraphic style</desc>
  <defs>
    
  </defs>

  <!-- top ornament stars -->
  <g fill="var(--color-text-secondary)" opacity="0.4" data-darkreader-inline-fill="" style="--darkreader-inline-fill: var(--darkreader-bg--color-text-secondary, var(--darkreader-background-ffffff, #181a1b));;fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.4;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <circle cx="340" cy="36" r="2" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="320" cy="44" r="1.2" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="360" cy="44" r="1.2" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="300" cy="38" r="1" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="380" cy="38" r="1" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="260" cy="52" r="0.8" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="420" cy="52" r="0.8" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="240" cy="44" r="1.3" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="440" cy="44" r="1.3" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="200" cy="58" r="0.7" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="480" cy="58" r="0.7" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="170" cy="40" r="1" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="510" cy="40" r="1" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="340" cy="58" r="1" style="fill:rgb(194, 192, 182);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- thin top rule -->
  <line x1="80" y1="68" x2="600" y2="68" style="fill:rgb(0, 0, 0);stroke:rgba(207, 203, 197, 0.3);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- main title: تشوّق -->
  <text x="340" y="128" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:42px;font-weight:700;text-anchor:middle;dominant-baseline:auto">تَشَوُّق</text>

  <!-- subtitle -->
  <text x="340" y="162" text-anchor="middle" style="fill:rgb(190, 184, 176);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:18px;font-weight:400;text-anchor:middle;dominant-baseline:auto">إيثوس الصحراء في ساعة الثالثة والربع فجراً</text>

  <!-- thin rule -->
  <line x1="80" y1="182" x2="600" y2="182" style="fill:rgb(0, 0, 0);stroke:rgba(207, 203, 197, 0.3);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- opening verse -->
  <text x="340" y="228" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">الصحراءُ لا تُزار، بل تَدَّعي.</text>
  <text x="340" y="264" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">ومن لمسَتهُ مرةً واحدةً</text>
  <text x="340" y="300" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">باتت سائرُ المناظر طوالَ عمره مجردَ انتظار.</text>

  <!-- thin rule -->
  <line x1="120" y1="322" x2="560" y2="322" style="fill:rgb(0, 0, 0);stroke:rgba(207, 203, 197, 0.3);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body paragraphs -->
  <text x="340" y="362" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">الصمتُ هناك ليس غيابَ الصوت،</text>
  <text x="340" y="394" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">بل هو ضغطٌ حيٌّ — يسمعُك وأنتَ تسمعُه،</text>
  <text x="340" y="426" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">والسماءُ في الثالثة والربع فجراً ليست مجردَ جمال،</text>
  <text x="340" y="458" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">بل هي حجةٌ لا تُردّ على وجود شيءٍ أكبرَ منّا.</text>

  <!-- thin rule -->
  <line x1="120" y1="480" x2="560" y2="480" style="fill:rgb(0, 0, 0);stroke:rgba(207, 203, 197, 0.3);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="520" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">التشوّقُ ليس نوستالجيا — فالنوستالجيا تنظرُ للوراء.</text>
  <text x="340" y="552" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">التشوّقُ يشدُّك في كل الاتجاهات في آنٍ واحد:</text>
  <text x="340" y="584" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">نحوَ ما مضى، ونحوَ ما لم يأتِ بعد،</text>
  <text x="340" y="616" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:20px;font-weight:400;text-anchor:middle;dominant-baseline:auto">ونحوَ لحظةٍ حاضرةٍ تبدو دومًا ناقصةً بلا رمالها.</text>

  <!-- thin rule -->
  <line x1="120" y1="638" x2="560" y2="638" style="fill:rgb(0, 0, 0);stroke:rgba(207, 203, 197, 0.3);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- closing verse -->
  <text x="340" y="682" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">من لمستهُ الصحراء يحملُ جزءًا منها،</text>
  <text x="340" y="716" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">لا في الذاكرة وحدها،</text>
  <text x="340" y="750" text-anchor="middle" style="fill:rgb(234, 230, 214);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Amiri, serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">بل في طريقةِ إنصاتِه للصمت.</text>

  <!-- thin bottom rule -->
  <line x1="80" y1="774" x2="600" y2="774" style="fill:rgb(0, 0, 0);stroke:rgba(207, 203, 197, 0.3);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

