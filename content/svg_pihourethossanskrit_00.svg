  <line x1="80" y1="68" x2="600" y2="68" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- π and title -->
  <text x="340" y="138" text-anchor="middle" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:54px;font-weight:400;text-anchor:middle;dominant-baseline:auto">π</text>
  <text x="340" y="174" text-anchor="middle" style="fill:rgb(255, 96, 112);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:16px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">पाई-होरा — सुजीवितस्य जीवनस्य तत्त्वम्</text>

  <line x1="80" y1="194" x2="600" y2="194" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- times in Devanagari numerals -->
  <text x="220" y="244" text-anchor="middle" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:24px;font-weight:700;text-anchor:middle;dominant-baseline:auto">०३ : १४</text>
  <text x="340" y="244" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">—</text>
  <text x="460" y="244" text-anchor="middle" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:24px;font-weight:700;text-anchor:middle;dominant-baseline:auto">२२ : ०७</text>
  <text x="340" y="272" text-anchor="middle" style="fill:rgb(255, 96, 112);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:16px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">अयुक्तिसंगता होरा उद्घाटयति · चितां होरा निरुणद्धि</text>

  <line x1="120" y1="294" x2="560" y2="294" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- opening verse -->
  <text x="340" y="336" text-anchor="middle" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:auto">आरभस्व यावत् जगत् न याचते।</text>
  <text x="340" y="372" text-anchor="middle" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:auto">समाप्नुहि यावत् दिनं न क्षीयते।</text>
  <text x="340" y="408" text-anchor="middle" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:auto">अन्तराले — न क्रमः, किन्तु जीवनम्।</text>

  <line x1="120" y1="430" x2="560" y2="430" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body 1 -->
  <text x="340" y="470" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">०३:१४ अयुक्तिसंगता होरा — तमसा, मौनेन, पूर्वकालेन।</text>
  <text x="340" y="504" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">यावत् स्पृहा न जागर्ति, यावत् भूमिकाः न धार्यन्ते,</text>
  <text x="340" y="538" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">आत्मा स्वसंगे तिष्ठति, अखण्डितः।</text>

  <line x1="120" y1="560" x2="560" y2="560" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body 2 -->
  <text x="340" y="600" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">π न समाप्यते। न गन्तव्यं प्राप्नोति।</text>
  <text x="340" y="634" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">प्रसरति — यत्नेन दृष्टं सत् सूक्ष्मतरं भवति।</text>
  <text x="340" y="668" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">सुजीवितं जीवनम् अपि तादृशमेव —</text>
  <text x="340" y="702" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">अन्तं विना गभीरतां प्राप्नोति।</text>

  <line x1="120" y1="724" x2="560" y2="724" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- body 3 -->
  <text x="340" y="764" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">२२:०७ — त्वं न क्षीणः। त्वम् अतिष्ठः।</text>
  <text x="340" y="798" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">सम्पूर्णे कोष्ठके गौरवम् अस्ति,</text>
  <text x="340" y="832" text-anchor="middle" style="fill:rgb(240, 208, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">यस्मिन् होरायां दिनं निक्षिप्यते तस्या वरणे।</text>

  <line x1="120" y1="854" x2="560" y2="854" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- closing -->
  <text x="340" y="876" text-anchor="middle" style="fill:rgb(255, 96, 112);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Tiro Devanagari Sanskrit&quot;, serif;font-size:16px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">अष्टादश होराः · त्रिपञ्चाशत् निमेषाः · अयुक्तं पूर्णतां प्राप्नोति</text>

  <line x1="80" y1="896" x2="600" y2="896" style="fill:rgb(0, 0, 0);stroke:rgb(255, 32, 64);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- bottom stars -->
  <g opacity="0.7" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <circle cx="340" cy="908" r="2" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="316" cy="912" r="1.2" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="364" cy="912" r="1.2" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="292" cy="908" r="0.8" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="388" cy="908" r="0.8" style="fill:rgb(255, 32, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

