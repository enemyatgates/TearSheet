<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TearSheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0f0e0c;
      --paper:     #f5f0e8;
      --rule:      #c8b89a;
      --accent:    #b5271e;
      --muted:     #7a6f61;
      --tag-bg:    #e8e0d0;
    }

    html { font-size: 16px; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Newsreader', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Masthead ─────────────────────────────────────────────── */
    .masthead {
      border-bottom: 3px double var(--ink);
      padding: 2rem 4vw 1.25rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 1rem;
    }

    .masthead-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    .masthead-meta.right { text-align: right; }

    .masthead-title {
      text-align: center;
    }

    .masthead-title h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: -0.02em;
      line-height: 0.9;
      text-transform: uppercase;
    }

    .masthead-title .rule-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      justify-content: center;
    }

    .masthead-title .rule-line span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .masthead-title .rule-line::before,
    .masthead-title .rule-line::after {
      content: '';
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: var(--rule);
    }

    /* ── Issue bar ────────────────────────────────────────────── */
    .issue-bar {
      border-bottom: 1px solid var(--ink);
      padding: 0.4rem 4vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .issue-bar .accent-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 0.4rem;
      vertical-align: middle;
    }

    /* ── Layout ───────────────────────────────────────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 4vw;
    }

    /* ── Section heading ──────────────────────────────────────── */
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 2rem 0 0.75rem;
      border-bottom: 1px solid var(--ink);
      margin-bottom: 0;
    }

    .section-head h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-head .count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      color: var(--accent);
      margin-left: auto;
    }

    /* ── Filter bar ───────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--rule);
    }

    .filter-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .filter-btn.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    /* ── Entry list ───────────────────────────────────────────── */
    #entries {
      list-style: none;
    }

    .entry {
      display: grid;
      grid-template-columns: 3rem 1fr auto;
      gap: 0 1.5rem;
      align-items: baseline;
      padding: 1.1rem 0;
      border-bottom: 0.5px solid var(--rule);
      text-decoration: none;
      color: inherit;
      transition: background 0.12s;
      cursor: pointer;
      position: relative;
    }

    .entry:hover { background: rgba(0,0,0,0.025); }
    .entry:hover .entry-title { color: var(--accent); }

    .entry-index {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: var(--rule);
      text-align: right;
      padding-top: 0.15rem;
    }

    .entry-body {}

    .entry-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 700;
      line-height: 1.25;
      transition: color 0.12s;
    }

    .entry-sub {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
      line-height: 1.5;
    }

    .entry-meta {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: 0.4rem;
      align-items: center;
    }

    .tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      background: var(--tag-bg);
      color: var(--muted);
    }

    .tag.featured {
      background: var(--accent);
      color: #fff;
    }

    .entry-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      color: var(--rule);
      white-space: nowrap;
      padding-top: 0.2rem;
      align-self: start;
    }

    /* ── Featured (first entry override) ─────────────────────── */
    .entry.is-featured {
      grid-template-columns: 3rem 1fr auto;
      padding: 1.75rem 0;
      border-bottom: 1px solid var(--ink);
    }

    .entry.is-featured .entry-title {
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 900;
    }

    .entry.is-featured .entry-sub {
      font-size: 1rem;
    }

    /* ── Empty state ──────────────────────────────────────────── */
    .empty {
      padding: 3rem 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: var(--rule);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
    }

    /* ── Footer ───────────────────────────────────────────────── */
    footer {
      margin-top: 4rem;
      padding: 1.5rem 4vw;
      border-top: 3px double var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      color: var(--rule);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Animations ───────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry {
      animation: fadeUp 0.3s ease both;
    }

    @media (max-width: 600px) {
      .masthead {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .masthead-meta.right { text-align: center; }
      .entry {
        grid-template-columns: 2rem 1fr;
      }
      .entry-date { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── Masthead ─────────────────────────────────────────────── -->
  <header class="masthead">
    <div class="masthead-meta">
      Raw HTML<br>
      Unfiltered output<br>
      No framework
    </div>
    <div class="masthead-title">
      <h1>TearSheet</h1>
      <div class="rule-line"><span>Est. 2026</span></div>
    </div>
    <div class="masthead-meta right">
      <span id="entry-count">—</span> documents<br>
      <span id="today-date"></span><br>
      tearsheet.vercel.app
    </div>
  </header>

  <div class="issue-bar">
    <span>Volume I</span>
    <span><span class="accent-dot"></span></span>
    <span>Each page its own world</span>
  </div>

  <!-- ── Main ─────────────────────────────────────────────────── -->
  <main class="container">

    <div class="section-head">
      <h2>Index</h2>
      <span class="count" id="visible-count"></span>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-tag="all">All</button>
      <!-- tag buttons injected by JS -->
    </div>

    <ul id="entries"></ul>

  </main>

  <footer>
    <span>TearSheet — raw &amp; unfiltered</span>
    <span>HTML · No build · No framework</span>
  </footer>

  <script>
    // ─────────────────────────────────────────────────────────────
    // ENTRIES — edit this array to add / remove / update documents
    //
    // Fields:
    //   title    (string, required)  — displayed headline
    //   href     (string, required)  — path to the HTML file
    //   sub      (string)            — italic deck / description
    //   date     (string)            — e.g. "2026-05-19"
    //   tags     (string[])          — used for filter buttons
    //   featured (bool)              — larger treatment, appears first
    //
    // ─────────────────────────────────────────────────────────────
    const ENTRIES = [
      {
        title:    "The Pi-Hour Schedule",
        href:     "contentthepihourschedule.html",
        sub:      "A doctrine of structured time — 03:14 to 22:07. Four phases, two rituals, zero ambiguity.",
        date:     "2026-05-19",
        tags:     ["schedule", "doctrine"],
        featured: true,
      },
      // ── Add your files below ──────────────────────────────────
      // {
      //   title:    "Your Document Title",
      //   href:     "your-file.html",
      //   sub:      "A short description of what this is.",
      //   date:     "2026-05-20",
      //   tags:     ["essay"],
      // },
    ];
    // ─────────────────────────────────────────────────────────────


    // ── Helpers ──────────────────────────────────────────────────
    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function allTags(entries) {
      const set = new Set();
      entries.forEach(e => (e.tags || []).forEach(t => set.add(t)));
      return [...set].sort();
    }

    // ── Render ───────────────────────────────────────────────────
    function render(filterTag) {
      const list = document.getElementById('entries');
      list.innerHTML = '';

      const sorted = [...ENTRIES].sort((a, b) => {
        if (a.featured && !b.featured) return -1;
        if (!a.featured && b.featured) return 1;
        return (b.date || '').localeCompare(a.date || '');
      });

      const filtered = filterTag === 'all'
        ? sorted
        : sorted.filter(e => (e.tags || []).includes(filterTag));

      document.getElementById('visible-count').textContent =
        filtered.length === ENTRIES.length
          ? `${filtered.length} documents`
          : `${filtered.length} of ${ENTRIES.length}`;

      if (filtered.length === 0) {
        list.innerHTML = `<li class="empty">No documents tagged "${filterTag}"</li>`;
        return;
      }

      filtered.forEach((entry, i) => {
        const li = document.createElement('li');
        const a  = document.createElement('a');
        a.className = 'entry' + (entry.featured ? ' is-featured' : '');
        a.href = entry.href;
        a.style.animationDelay = `${i * 40}ms`;

        const tagHTML = [
          ...(entry.featured ? ['<span class="tag featured">Featured</span>'] : []),
          ...(entry.tags || []).map(t => `<span class="tag">${t}</span>`),
        ].join('');

        a.innerHTML = `
          <span class="entry-index">${String(i + 1).padStart(2, '0')}</span>
          <div class="entry-body">
            <div class="entry-title">${entry.title}</div>
            ${entry.sub ? `<div class="entry-sub">${entry.sub}</div>` : ''}
            ${tagHTML ? `<div class="entry-meta">${tagHTML}</div>` : ''}
          </div>
          <span class="entry-date">${formatDate(entry.date)}</span>
        `;

        li.appendChild(a);
        list.appendChild(li);
      });
    }

    // ── Filter buttons ───────────────────────────────────────────
    function buildFilters() {
      const bar  = document.getElementById('filter-bar');
      const tags = allTags(ENTRIES);
      tags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.tag = tag;
        btn.textContent = tag;
        bar.appendChild(btn);
      });

      bar.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.tag);
      });
    }

    // ── Init ─────────────────────────────────────────────────────
    document.getElementById('entry-count').textContent = ENTRIES.length;
    document.getElementById('today-date').textContent =
      new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    buildFilters();
    render('all');
  </script>

</body>
</html>
